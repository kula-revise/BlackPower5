<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Power Movement · Build the Skeleton</title>
<style>

  /* ================= PALETTE AND TYPE ================= */
  :root {
      /* Black Power: Ink and Amber. Dark ground, two accents split by job. */
      --paper: #1B1720;     /* page ground */
      --sheet: #241E2C;     /* card sheet */
      --white: #2C2536;     /* inner panels, sources, explanations */
      --ink: #F1ECF5;       /* text */
      --ink-soft: #AEA4BC;
      --flame: #9C6BE6;     /* accent one: navigation and emphasis (amethyst) */
      --on-flame: #1B1720;  /* text on a solid accent-one block */
      --leaf: #E2A63C;      /* accent two: anything the learner earned (amber) */
      --on-leaf: #1B1720;   /* text on a solid accent-two block */
      --hair: rgba(241,236,245,0.16);
      --rail: rgba(241,236,245,0.12);
      --tint: rgba(226,166,60,0.10);
      --tint-rule: rgba(226,166,60,0.42);
      --slot-bg: rgba(241,236,245,0.05);
      --chipA-bg: rgba(156,107,230,0.20); --chipA-fg: #C3A2F0;
      --chipB-bg: rgba(174,164,188,0.16); --chipB-fg: #C6BCD4;
      --chipN-bg: rgba(241,236,245,0.07); --chipN-fg: #B4A9C2;
      --ev3-bg: rgba(226,166,60,0.16); --ev3-fg: #E2A63C;
      --ok-bg: rgba(226,166,60,0.16);
      --bad-bg: rgba(174,164,188,0.10); --bad-border: #8A7E98;
      --btn-hover: #8553C8;
      --start-hover: #2A2338;
      --sans: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --serif: Georgia, 'Times New Roman', serif;
    }
  /* Bright light inversion, kept but not exposed. Add class "bright" to body to switch. */
    body.bright {
      --paper: #F1ECE2;
      --sheet: #FAF6EE;
      --white: #FFFDF7;
      --ink: #241C2E;
      --ink-soft: #5E5568;
      --flame: #6A3FB0;
      --on-flame: #FFFDF7;
      --leaf: #9A6B12;
      --on-leaf: #FFFDF7;
      --hair: rgba(36,28,46,0.18);
      --rail: rgba(36,28,46,0.12);
      --tint: rgba(154,107,18,0.08);
      --tint-rule: rgba(154,107,18,0.35);
      --slot-bg: rgba(255,255,255,0.5);
      --chipA-bg: #E9DEF7; --chipA-fg: #5A2E9A;
      --chipB-bg: #E6E2EC; --chipB-fg: #4A4358;
      --chipN-bg: #E7E2DA; --chipN-fg: #4E4658;
      --ev3-bg: #F3E7CC; --ev3-fg: #7A5410;
      --ok-bg: rgba(154,107,18,0.12);
      --bad-bg: rgba(36,28,46,0.06); --bad-border: #9A8FA6;
      --btn-hover: #57329A;
      --start-hover: #0E0A16;
    }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .container { max-width: 720px; margin: 0 auto; }
  /* sources set as typed minutes with a clause marker in the left margin */
    .source { background: var(--white); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 1.15rem 1.2rem 1.2rem 2.9rem; margin: 1.1rem 0; position: relative; }
  /* --- ordering and sorting --- */
    .ord-strip { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.9rem; }
  /* --- carousel --- */
    .car { margin: 1.1rem 0 0.4rem; }

  body {
      min-height: 100vh;
      background: var(--paper);
      padding: 1.6rem 1rem 3rem;
      font-family: var(--serif);
      color: var(--ink);
      line-height: 1.6;
    }

  /* ================= PAGE FURNITURE ================= */
  .top-bar { margin-bottom: 1.6rem; }
  .top-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 0.5rem; gap: 1rem; flex-wrap: wrap; }
  .top-count { color: var(--ink-soft); font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
  .track { height: 2px; background: var(--rail); overflow: hidden; }
  .fill { height: 100%; background: var(--flame); transition: width 0.35s ease; width: 0%; }
  .nav { display: flex; justify-content: space-between; gap: 0.8rem; margin-top: 0.4rem; }
  .ord-slot.filled { border-style: solid; background: var(--white); }
  .quiet { color: var(--ink-soft); }
  .quiet.pull { border-left-color: var(--hair); }
  .hidden { display: none !important; }
  .footer { text-align: center;  font-size: 0.76rem; color: var(--ink-soft); margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--hair); line-height: 1.65; }

  /* ================= COVER ================= */
  .flourish .rule-ink { stroke: var(--ink); }
  .flourish .rule-accent { stroke: var(--flame); }
  .flourish .dot { fill: var(--flame); }
  .flourish { display: block; margin: 0 auto 1.3rem; width: 100%; max-width: 260px; height: 26px; }
  .cover { min-height: 82vh; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 1rem 0 2rem; }
  .cover-eyebrow { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 1.4rem; }
  .cover-title { font-family: var(--sans); font-size: clamp(2.4rem, 9vw, 4rem); font-weight: 600; line-height: 1.04; letter-spacing: -0.02em; color: var(--ink); }
  .cover .flourish { margin: 1.5rem auto 1.4rem; }
  .cover-line { font-family: var(--serif); font-style: italic; font-size: clamp(1.05rem, 3vw, 1.4rem); color: var(--ink-soft); line-height: 1.6; max-width: 32rem; margin: 0 auto; }
  .cover-sub { font-family: var(--sans); font-size: 0.76rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); margin-top: 1.6rem; }
  .cover-actions { margin-top: 2.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.7rem; }
  .btn-begin { padding: 1rem 3rem; font-size: 1.05rem; }
  .cover .btn-skip { width: auto; justify-content: center; }

  /* ================= CARDS AND PROSE ================= */
  .card { background: var(--sheet); border-top: 2px solid var(--ink); padding: 1.5rem 1.4rem 1.6rem; margin-bottom: 1.2rem; }
  .card h2 { font-family: var(--sans); font-size: 1.38rem; font-weight: 600; line-height: 1.25; margin-bottom: 0.9rem; letter-spacing: -0.01em; }
  .card p { font-size: 1rem; line-height: 1.72; margin-bottom: 0.9rem; }
  .card p:last-child { margin-bottom: 0; }
  .pull { border-left: 3px solid var(--flame); padding-left: 1rem; color: var(--ink); margin: 1.1rem 0; }
  .facts { margin: 1rem 0 0.4rem; padding-left: 1.15rem; }
  .facts li { font-size: 0.97rem; line-height: 1.7; margin-bottom: 0.5rem; }
  .key { color: var(--leaf); font-weight: 700; }
  .recap { background: var(--sheet); border-top: 2px solid var(--leaf); padding: 1.35rem 1.4rem 1.5rem; }
  .recap h2 { font-family: var(--sans); font-size: 1.28rem; font-weight: 600; margin-bottom: 0.9rem; }
  .recap ul { margin: 0; padding-left: 1.15rem; }
  .recap li { font-size: 0.97rem; line-height: 1.75; margin-bottom: 0.55rem; }
  .recap li:last-child { margin-bottom: 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 0.7rem; margin: 1.1rem 0 0.5rem; }
  .stat { background: var(--sheet); border-top: 2px solid var(--flame); padding: 0.9rem 0.8rem; text-align: center; }
  .stat-n {  font-size: 1.7rem; font-weight: 700; color: var(--ink); line-height: 1; }
  .stat-l { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 0.45rem; line-height: 1.4; }
  .blist { list-style: none; margin: 1rem 0 0.4rem; padding: 0; }
  .blist li { position: relative; padding-left: 1.5rem; font-size: 1rem; line-height: 1.72; margin-bottom: 0.75rem; }
  .blist li:last-child { margin-bottom: 0; }
  .blist li::before { content: ""; position: absolute; left: 0; top: 0.62rem; width: 8px; height: 8px; background: var(--flame); }
  .blist li strong { color: var(--leaf); }
  .blist.leaf li::before { background: var(--leaf); }

  /* ================= STORY HOOK ================= */
  .story { padding-top: 0.6rem; }
  .story-marker { text-align: center; margin-bottom: 0.4rem; }
  .story-num {  font-size: clamp(2.4rem, 8vw, 3.6rem); font-weight: 700; color: var(--flame); line-height: 1; letter-spacing: -0.02em; }
  .story-unit { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-soft); margin-top: 0.35rem; }
  .story-rule { height: 1px; background: var(--hair); margin: 1.2rem 0 1.6rem; }
  .story-line { font-size: 1.12rem; line-height: 1.85; color: var(--ink); opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; margin-bottom: 0.9rem; }
  .story-line.vis { opacity: 1; transform: translateY(0); }
  .story-line.last { color: var(--leaf); font-style: italic; }

  /* ================= SOURCES AND FIGURES ================= */
  .source .clause { position: absolute; left: 0.85rem; top: 1.15rem;  font-size: 0.74rem; font-weight: 600; color: var(--flame); letter-spacing: 0.02em; }
  .source-attr {  font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 0.7rem; line-height: 1.55; }
  .source-body { font-size: 0.97rem; line-height: 1.75; }
  .source-body p { margin-bottom: 0.7rem; }
  .source-body p:last-child { margin-bottom: 0; }
  .source-body em { color: var(--leaf); font-style: italic; }
  .toggle-btn { background: transparent; border: none; color: var(--flame); cursor: pointer; font-family: var(--sans); font-size: 0.82rem; text-decoration: underline; padding: 0.65rem 0 0; }
  .toggle-body { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed var(--hair); font-size: 0.9rem; color: var(--ink-soft); line-height: 1.65; }
  .toggle-body.open { display: block; }
  .evtag { display: inline-block; margin-top: 0.9rem; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; padding: 0.24rem 0.6rem; }
  .evtag.home { background: var(--chipA-bg); color: var(--chipA-fg); }
  .evtag.ground { background: var(--chipB-bg); color: var(--chipB-fg); }
  .evtag.exit { background: var(--ev3-bg); color: var(--ev3-fg); }
  .figure { margin: 1rem 0 0.3rem; }
  .figure img { display: block; height: auto; border: 1px solid var(--hair); margin: 0 auto; }
  .figure.wide img { width: 100%; max-width: 460px; }
  .figure.portrait img { width: 100%; max-width: 320px; }
  .figure svg { display: block; width: 100%; height: auto; }
  .figure figcaption {  font-size: 0.76rem; color: var(--ink-soft); margin-top: 0.5rem; line-height: 1.55; text-align: center; }

  /* ================= QUESTIONS ================= */
  .chip { display: inline-block; padding: 0.22rem 0.62rem; font-family: var(--sans); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; width: fit-content; }
  .chip-argue { background: var(--chipA-bg); color: var(--chipA-fg); }
  .chip-evidence { background: var(--chipB-bg); color: var(--chipB-fg); }
  .chip-weigh { background: var(--leaf); color: var(--on-leaf); }
  .chip-instinct { background: var(--chipN-bg); color: var(--chipN-fg); }
  .stage-tag { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 0.9rem; }
  .q-text { font-size: 1.14rem; line-height: 1.5; margin-bottom: 1.15rem; }
  .options { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1.15rem; }
  .option { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.95rem 1.05rem; background: var(--paper); border: 1px solid var(--hair); cursor: pointer; font-family: inherit; text-align: left; font-size: 0.95rem; line-height: 1.55; color: var(--ink); transition: all 0.18s; width: 100%; }
  .option:hover:not(:disabled) { background: var(--white); border-color: var(--flame); }
  .option:disabled { cursor: default; }
  .option.selected { background: var(--white); border-color: var(--ink); border-width: 2px; padding: 0.89rem 0.99rem; }
  .option.correct { background: var(--ok-bg); border-color: var(--leaf); border-width: 2px; padding: 0.89rem 0.99rem; }
  .option.wrong { background: var(--bad-bg); border-color: var(--bad-border); border-width: 2px; padding: 0.89rem 0.99rem; }
  .option.dimmed { opacity: 0.5; }
  .opt-letter {  font-weight: 600; color: var(--flame); min-width: 1.1rem; }
  .opt-text { flex: 1; }
  .opt-mark { font-weight: bold; font-size: 1.05rem; }
  .explanation { background: var(--white); border-top: 1px solid var(--hair); border-left: 3px solid var(--flame); padding: 1.05rem 1.15rem; margin-bottom: 0.3rem; }
  .expl-label { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 0.5rem; }
  .expl-text { line-height: 1.7; font-size: 0.93rem; }
  .qbox { background: var(--white); border-top: 1px solid var(--hair); border-left: 3px solid var(--flame); padding: 1.05rem 1.2rem; margin: 1.3rem 0 1.5rem; }
  .qbox .qlabel { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 0.5rem; }
  .qbox .qtext { font-size: 1.05rem; line-height: 1.55; }

  /* ================= ORDER AND SORT ================= */
  .ord-slot { display: flex; align-items: center; gap: 0.7rem; width: 100%; text-align: left; padding: 0.75rem 0.9rem; background: var(--paper); border: 1px solid var(--hair); font-size: 0.94rem; color: var(--ink); font-family: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .ord-slot .ord-txt { flex: 1; }
  .ord-slot .ord-x { color: var(--ink-soft); font-size: 0.85rem; }
  .ord-slot:disabled { cursor: default; }
  .ord-slot.right { border-color: var(--leaf); background: var(--ok-bg); }
  .ord-slot.wrong { border-color: var(--bad-border); background: var(--bad-bg); }
  .ord-rank {  font-weight: 700; color: var(--flame); min-width: 1.2rem; }
  .ord-pool { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1rem; }
  .ord-chip { text-align: left; -webkit-user-select: none; user-select: none; padding: 0.8rem 0.95rem; background: var(--paper); border: 1px solid var(--hair); color: var(--ink); font-family: inherit; font-size: 0.94rem; line-height: 1.5; cursor: pointer; }
  .ord-chip:hover:not(:disabled) { border-color: var(--leaf); background: var(--white); }
  .ord-chip:disabled { opacity: 0.3; cursor: default; }
  .ord-actions { display: flex; gap: 0.6rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
  .sort-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 1rem; }
  .sort-col { background: var(--sheet); border-top: 2px solid var(--hair); padding: 0.8rem 0.7rem; min-height: 5rem; }
  .sort-col h4 { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--leaf); margin-bottom: 0.6rem; }
  .sort-tag { display: block; width: 100%; text-align: left; font-size: 0.86rem; line-height: 1.45; padding: 0.5rem 0.6rem; margin-bottom: 0.4rem; background: var(--white); border: 1px solid var(--hair); color: var(--ink); }
  .sort-tag.right { border-color: var(--leaf); background: var(--ok-bg); }
  .sort-tag.wrong { border-color: var(--bad-border); background: var(--bad-bg); }
  .sort-prompt {  font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.6rem; }

  /* ================= CAROUSEL ================= */
  .car [data-car-next] { border-color: var(--flame); color: var(--flame); }
  .car-frame { background: var(--white); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 1.2rem 1.2rem 1.3rem; min-height: 8.5rem; }
  .car-count { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 0.6rem; }
  .car-body { font-size: 1rem; line-height: 1.72; }
  .car-body strong { color: var(--leaf); }
  .car-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin-top: 0.7rem; }
  .car-dots { display: flex; gap: 0.35rem; align-items: center; }
  .car-hint { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .car-prompt { display: flex; align-items: baseline; gap: 0.5rem; font-family: var(--sans); font-size: 0.82rem; color: var(--flame); margin-bottom: 0.55rem; }
  .car-prompt .cp-mark { font-size: 1rem; line-height: 1; }
  .car-prompt.done { color: var(--leaf); }
  .car-dot.read { background: var(--leaf); }
  .car-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hair); border: none; padding: 0; cursor: pointer; }
  .car-dot.on { background: var(--flame); }

  /* ================= KEY TERMS AND MEMORY ================= */
  .terms { margin-top: 1.3rem; padding-top: 1rem; border-top: 1px solid var(--hair); }
  .terms-label { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--leaf); font-weight: 600; margin-bottom: 0.7rem; }
  .term-row { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .term-btn { font-family: var(--sans); font-size: 0.84rem; padding: 0.42rem 0.75rem; background: transparent; border: 1px solid var(--hair); color: var(--ink); cursor: pointer; line-height: 1.3; }
  .term-btn:hover { border-color: var(--leaf); }
  .term-btn.open { background: var(--ok-bg); border-color: var(--leaf); }
  .term-btn .plus { color: var(--leaf); font-family: var(--sans); font-weight: 600; margin-left: 0.4rem; }
  .term-def { display: none; margin-top: 0.8rem; padding: 0.9rem 1rem; background: var(--white); border-top: 1px solid var(--hair); border-left: 3px solid var(--leaf); font-size: 0.92rem; line-height: 1.7; }
  .term-def.open { display: block; }
  .term-def strong {  font-size: 0.86rem; display: block; margin-bottom: 0.3rem; color: var(--leaf); }
  .memory { background: var(--tint); border-top: 1px solid var(--tint-rule); padding: 1rem 1.15rem; margin: 1.1rem 0; }
  .memory-label { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--leaf); font-weight: 600; margin-bottom: 0.5rem; }
  .memory-label.memory-toggle { display: flex; align-items: center; justify-content: space-between; gap: 1rem; cursor: pointer; margin-bottom: 0; }
  .memory-label.memory-toggle:hover { color: var(--ink); }
  .memory-label .mplus { font-size: 0.95rem; line-height: 1; }
  .memory.open .memory-label.memory-toggle { margin-bottom: 0.7rem; }
  .memory p { font-size: 0.95rem; line-height: 1.7; margin-bottom: 0.6rem; }
  .memory p:last-child { margin-bottom: 0; }

  
  
  
  
  
  .finalessay { background: var(--white); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 1.5rem 1.4rem; margin: 1.1rem 0; }
  .finalessay .fq {  font-weight: 600; color: var(--flame); font-size: 0.97rem; margin-bottom: 1rem; line-height: 1.5; padding-bottom: 0.9rem; border-bottom: 1px solid var(--hair); }
  .finalessay p { font-size: 0.96rem; line-height: 1.78; margin-bottom: 0.9rem; text-indent: 1.2rem; }
  .finalessay p:first-of-type { text-indent: 0; }
  .finalessay p:last-child { margin-bottom: 0; }

  /* ================= RESULTS ================= */
  .header-block { text-align: center; margin-bottom: 2rem; }
  .eyebrow { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--flame); font-weight: 600; margin-bottom: 0.85rem; }
  .masthead { font-family: var(--sans); font-size: clamp(1.9rem,5.4vw,2.9rem); font-weight: 600; line-height: 1.14; letter-spacing: -0.015em; }
  .sub { font-size: 0.98rem; color: var(--ink-soft); margin-top: 0.6rem; }
  .score-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .score-block { background: var(--sheet); border-top: 2px solid var(--ink); padding: 1.25rem 0.8rem; text-align: center; }
  .score-num { font-size: 2.4rem; font-weight: 700; color: var(--ink); line-height: 1; }
  .score-num.red { color: var(--flame); }
  .score-den { font-size: 1.05rem; color: var(--ink-soft); font-weight: 400; }
  .score-label { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-top: 0.5rem; font-weight: 600; }
  .grade-desc { text-align: center; margin-bottom: 1.5rem; padding: 0 0.5rem; line-height: 1.68; }
  .breakdown { background: var(--sheet); border-top: 2px solid var(--ink); padding: 1.25rem; margin-bottom: 1.3rem; }
  .breakdown-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--leaf); font-weight: 600; margin-bottom: 1rem; text-align: center; }
  .bd-row { display: grid; grid-template-columns: 1fr 110px 46px; gap: 0.7rem; align-items: center; margin-bottom: 0.7rem; font-size: 0.86rem; }
  .bd-name { font-size: 0.92rem; }
  .bd-bar { height: 8px; background: var(--rail); overflow: hidden; }
  .bd-fill { height: 100%; background: var(--leaf); transition: width 0.4s; }
  .bd-score { color: var(--ink-soft); text-align: right; font-weight: 700; }

  /* ================= BUTTONS ================= */
  .btn-secondary { padding: 0.72rem 1.2rem; background: transparent; border: 1px solid var(--hair); color: var(--ink); font-family: var(--sans); font-size: 0.88rem; cursor: pointer; }
  .btn-secondary:hover:not(:disabled) { background: var(--sheet); }
  .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { padding: 0.76rem 1.5rem; background: var(--flame); border: none; color: var(--on-flame); font-family: var(--sans); font-size: 0.93rem; cursor: pointer; font-weight: 600; }
  .btn-primary:hover:not(:disabled) { background: var(--btn-hover); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-skip { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 0.6rem; padding: 0.85rem 1.35rem; background: transparent; border: 1px solid var(--hair); color: var(--ink-soft); cursor: pointer; font-family: var(--sans); text-align: left; transition: all 0.2s; }
  .btn-skip:hover { color: var(--ink); border-color: var(--leaf); }
  .btn-skip .sk-t { font-size: 0.92rem; }
  .btn-skip .sk-a { font-size: 1.1rem; color: var(--leaf); }
  .btn-small { font-family: var(--sans); font-size: 0.82rem; padding: 0.55rem 1rem; background: transparent; border: 1px solid var(--hair); color: var(--ink); cursor: pointer; }
  .btn-small:hover:not(:disabled) { border-color: var(--leaf); }
  .btn-small:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ================= POP UPS ================= */
  .modal-back { position: fixed; inset: 0; background: rgba(8,16,28,0.72); display: flex; align-items: center; justify-content: center; padding: 1.2rem; z-index: 50; }
  .modal { background: var(--sheet); border-top: 3px solid var(--flame); max-width: 24rem; width: 100%; padding: 1.6rem 1.5rem 1.5rem; text-align: center; }
  .modal-label { font-family: var(--sans); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--leaf); font-weight: 600; margin-bottom: 0.7rem; }
  .modal h3 { font-family: var(--sans); font-size: 1.2rem; font-weight: 600; margin-bottom: 0.7rem; }
  .modal p { font-size: 1rem; line-height: 1.7; color: var(--ink); margin-bottom: 1.3rem; }

  .cover-line span{opacity:0;transition:opacity .5s ease}.cover-line span.vis{opacity:1}
#kula-mode-toggle, .mode-toggle { min-height: 44px !important; padding-top: 0.6rem !important; padding-bottom: 0.6rem !important; box-sizing: border-box !important; }
#next-btn, #begin-btn, #kdone-btn, #kretake-btn { min-height: 44px !important; }
.container{max-width:720px;margin:0 auto;padding:1.2rem 1.1rem 3rem;}
.cap-intro{font-size:1.04rem;line-height:1.74;margin-bottom:1.1rem;}
.yourpoint{background:var(--white);border:1px solid var(--hair);border-left:4px solid var(--flame);padding:0.8rem 0.95rem;margin-bottom:1.1rem;font-family:var(--serif);font-size:1rem;line-height:1.5;}
.yourpoint b{display:block;font-family:var(--sans);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--flame);font-weight:700;margin-bottom:0.3rem;}
.evlist{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.2rem;}
.evrow{display:flex;align-items:center;gap:0.85rem;padding:0.85rem 1rem;background:var(--paper);border:1px solid var(--hair);}
.evrow .evtext{flex:1;font-family:var(--serif);font-size:1rem;line-height:1.55;}
.evrow .evtext .off{display:block;font-family:var(--sans);font-size:0.78rem;color:var(--ink-soft);margin-top:0.2rem;}
.evtoggle{font-family:var(--sans);font-size:0.78rem;font-weight:700;border:1px solid var(--flame);color:var(--flame);background:transparent;padding:0.4rem 0.85rem;cursor:pointer;min-height:38px;white-space:nowrap;}
.evrow.use{border-color:var(--flame);border-width:2px;background:var(--white);}
.evrow.use .evtoggle{background:var(--flame);color:var(--on-flame);border-color:var(--flame);}
.evrow.ok{border-color:var(--leaf);border-width:2px;background:var(--ev3-bg);}
.evrow.miss{border-color:var(--leaf);border-style:dashed;border-width:2px;}
.evrow.wrong{border-color:var(--bad-border);border-width:2px;background:var(--bad-bg);}
.evtag{font-family:var(--sans);font-size:0.7rem;font-weight:700;letter-spacing:0.08em;}
.evtag.y{color:var(--leaf);} .evtag.n{color:var(--ink-soft);}
.frame{border:1px solid var(--hair);border-left:5px solid var(--flame);background:var(--white);padding:1.2rem 1.3rem;margin-bottom:1.2rem;}
.frame .fp{padding:0.7rem 0 0.95rem;border-bottom:1px dashed var(--hair);}
.frame .fp:last-child{border-bottom:none;padding-bottom:0;}
.frame .frole{font-family:var(--sans);font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--flame);font-weight:700;margin-bottom:0.3rem;}
.frame .fts{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.5;margin-bottom:0.5rem;}
.frame .flabel{font-family:var(--sans);font-size:0.66rem;font-weight:700;color:var(--ink-soft);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.2rem;}
.frame ul{margin:0.1rem 0 0.6rem;padding-left:1.15rem;}
.frame li{font-family:var(--serif);margin-bottom:0.25rem;line-height:1.5;}
.frame .flink{font-family:var(--serif);font-style:italic;color:var(--ink-soft);}
.writeup{font-family:var(--sans);background:var(--sheet);border:1px solid var(--tint-rule);border-left:5px solid var(--leaf);padding:1.1rem 1.2rem;}
.writeup b{color:var(--leaf);font-size:1.05rem;}
.writeup .wsub{font-size:0.92rem;line-height:1.6;color:var(--ink-soft);margin-top:0.4rem;}
.cap-prog{font-family:var(--sans);font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:0.9rem;}
.cap-actions{display:flex;justify-content:flex-end;}
#kula-mode-toggle{position:fixed;top:0.7rem;right:0.7rem;z-index:60;font-family:var(--sans);font-size:0.7rem;font-weight:700;letter-spacing:0.06em;background:var(--sheet);color:var(--ink);border:1px solid var(--hair);border-radius:20px;padding:0.4rem 0.9rem;cursor:pointer;min-height:34px;}
#kula-mode-toggle:hover{border-color:var(--flame);}
#kula-mode-toggle #kmt-icon svg{width:1rem;height:1rem;display:block;}
</style>
</head>
<body>
<script>/* kula: LMS embed events. "completed" fires once, when the learner reaches the closing screen. "advance" fires from the final button. */
(function(){var sentCompleted=false;window.kulaEmbed=function(ev){if(ev==="completed"){if(sentCompleted)return;sentCompleted=true;}try{window.parent.postMessage({type:"lms-embed-event",version:"1.0",payload:{event:ev}},"*");}catch(e){}};})();</script>
<button id="kula-mode-toggle" type="button" onclick="kulaToggle()" aria-label="Switch light or dark mode"><span id="kmt-icon"></span><span id="kmt-label"></span></button>
<div class="container"><div id="stage"></div></div>
<script>
var K="kula-mode";var SUN="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4.2'/><path d='M12 1.6v2M12 20.4v2M3.6 12h-2M22.4 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4'/></svg>";var MOON="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z'/></svg>";function paint(){var d=!document.body.classList.contains("bright");var ic=document.getElementById("kmt-icon"),la=document.getElementById("kmt-label");if(ic)ic.innerHTML=d?SUN:MOON;if(la)la.textContent=d?"Light mode":"Dark mode";}window.kulaToggle=function(){document.body.classList.toggle("bright");try{localStorage.setItem(K,document.body.classList.contains("bright")?"light":"dark")}catch(e){}paint();};try{if(localStorage.getItem(K)==="light")document.body.classList.add("bright")}catch(e){}paint();
var esc=function(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;};
var frame={}, idx=0;

var COVER={
  eyebrow:"Kula Revise \u00b7 Grade 12 History \u00b7 The Black Power Movement",
  title:"Build the Skeleton",
  lines:["Fifty marks. One hour. Three pages.","You will not write the essay here.","You build its skeleton: the line, the points, the evidence, the verdict.","Then you take the frame away and write it in your own words."]
};

var STEPS=[
  {type:'cover'},
  {type:'pick', tag:'Introduction \u00b7 your line of argument', prog:'Line of argument',
    h2:'Choose your line of argument',
    intro:'Every mark in this essay hangs off one sentence: the line you argue. The question asks to what extent Black Power brought African Americans together, so your line has to take a side on that. Pick the sentence that argues, not the one that only describes.',
    correct:1,
    opts:[
      "Black Power was a philosophy of the 1960s and 1970s involving many leaders, groups and different ideas.",
      "Black Power united African Americans around pride and self-reliance, but never reached the poverty that produced it.",
      "Black Power completely united African Americans and solved all of the poverty and policing they faced."
    
    ],
    expl:"<b>The middle sentence argues.</b> It takes a side, real but limited, and says why. The whole essay then has a line to follow. The first only describes: a marker sees you telling the story rather than making a case, and that caps you at middle marks. The last takes the wrong line, and the facts in this topic go against it.",
    save:function(s){frame.arg=s.opts[s.correct];}},

  {type:'pick', tag:'Body 1 \u00b7 self-definition and pride', prog:'Body 1 of 3 \u00b7 claim',
    h2:'Body paragraph 1: the topic sentence',
    intro:'Your first body paragraph is about identity. Every paragraph opens with a claim that pushes your line forward. Pick the topic sentence that takes a clear position.',
    correct:2,
    opts:[
      "Black Power involved a number of different leaders and ideas about identity.",
      "Black Power told people to hide who they were and blend in quietly.",
      "It brought people together first by changing how they saw themselves."
    
    ],
    expl:"<b>The last one takes a side you can defend.</b> The first only says ideas existed. The middle one takes the wrong line, because the movement told people to take pride in who they were rather than hide it. Argue that and you are fighting your own evidence.",
    save:function(s){frame.b1ts=s.opts[s.correct];}},
  {type:'evidence', tag:'Body 1 \u00b7 self-definition and pride', prog:'Body 1 of 3 \u00b7 evidence',
    h2:'Now choose the evidence',
    ts:"It brought people together first by changing how they saw themselves.",
    intro:'A claim is only worth the evidence under it. Tap Use it for the facts that back this exact point about identity. Leave out the real facts that belong to a different paragraph.',
    items:[
      {t:"Carmichael's call for self-definition and pride", use:true},
      {t:"Control of their own institutions", use:true},
      {t:"The slogan Black is beautiful", use:true},
      {t:"A shared identity gave people a reason to act together", use:true},
      {t:"The Panthers' free breakfast programme fed children", use:false, off:"that is the survival programmes, the next paragraph"},
      {t:"Malcolm X's case for self-defence", use:false, off:"that splits the movement: the counter-argument"}
    ],
    expl:"<b>The four identity facts back this point.</b> The breakfast programme and self-defence are real and important, but each belongs in a different paragraph. Match each fact to the exact point it proves. That is the evidence skill.",
    link:"A shared sense of who they were gave people a reason to act together.",
    save:function(s){frame.b1ev=s.chosen; frame.b1link=s.link;}},

  {type:'pick', tag:'Body 2 \u00b7 the survival programmes', prog:'Body 2 of 3 \u00b7 claim',
    h2:'Body paragraph 2: the topic sentence',
    intro:'Your second body paragraph turns to the Black Panther Party. This is where you show how it organised communities day to day. Pick the topic sentence that takes a clear position.',
    correct:0,
    opts:[
      "It brought communities together most through the survival programmes, not the guns.",
      "The Black Panther Party did a number of different things in the 1960s.",
      "The Panthers brought people together mainly through their armed patrols and rifles."
    
    ],
    expl:"<b>The first takes a side.</b> The programmes did the organising, not the weapons. The middle one only describes. The last takes the wrong line, because the guns gave the state a reason to attack, and that broke the party.",
    save:function(s){frame.b2ts=s.opts[s.correct];}},
  {type:'evidence', tag:'Body 2 \u00b7 the survival programmes', prog:'Body 2 of 3 \u00b7 evidence',
    h2:'Now choose the evidence',
    ts:"It brought communities together most through the survival programmes, not the guns.",
    intro:'Same job again: tap Use it for the facts that prove this point about the programmes. Leave out the ones that belong to another paragraph.',
    items:[
      {t:"The free breakfast programme fed children before school", use:true},
      {t:"Free health clinics in poor neighbourhoods", use:true},
      {t:"The survival programmes built loyalty in the community", use:true},
      {t:"The programmes organised people around daily needs", use:true},
      {t:"The slogan Black is beautiful gave people pride", use:false, off:"that is identity, the first paragraph"},
      {t:"Poverty and unequal policing survived untouched", use:false, off:"that is a limit: the counter-argument"}
    ],
    expl:"<b>The four programme facts build this point.</b> Black is beautiful is identity. The surviving poverty is a limit, and you will raise it against the counter-argument. Keep each fact in the paragraph it actually proves.",
    link:"The programmes did more organising than the weapons ever did.",
    save:function(s){frame.b2ev=s.chosen; frame.b2link=s.link;}},

  {type:'pick', tag:'Body 3 \u00b7 counter-argument', prog:'Body 3 of 3 \u00b7 claim',
    h2:'Body paragraph 3: the other side',
    intro:'The command word is to what extent, so you have to weigh the other side before you decide. Pick the topic sentence that states the opposing case fairly.',
    correct:1,
    opts:[
      "There were several problems and disagreements going on inside the movement at that time.",
      "It can be argued the movement drove people apart as much as together.",
      "The movement had no divisions at all and faced no problems whatsoever."
    
    ],
    expl:"<b>The middle one states the other side fairly.</b> That is what the counter-argument step needs. The first only says problems existed. The last refuses to admit the other side at all, so there is nothing left to weigh against.",
    save:function(s){frame.c1ts=s.opts[s.correct];}},
  {type:'evidence', tag:'Body 3 \u00b7 counter-argument', prog:'Body 3 of 3 \u00b7 evidence',
    h2:'The evidence for the other side',
    ts:"It can be argued that the movement drove people apart as much as it drew them together.",
    intro:'Here you gather the strongest facts for the opposing case. Tap Use it for the ones that show division or failure. Leave out the successes: those cannot make the case against.',
    items:[
      {t:"Malcolm X's self-defence frightened off allies and split the movement", use:true},
      {t:"The guns gave the state a reason to attack, and that broke the Panthers", use:true},
      {t:"Poverty and unequal policing survived untouched", use:true},
      {t:"The free breakfast programme fed children", use:false, off:"a success, not a case against"},
      {t:"Black is beautiful gave people pride", use:false, off:"a success, not a case against"}
    ],
    expl:"<b>These three facts are the strongest case for the other side.</b> The breakfast programme and the pride are successes, so they cannot be the counter. Then you rebut. It still won lasting gains and a durable pride. It brought people together to a real if limited extent.",
    link:"Yet it still won lasting gains and a durable pride, so it brought people together to a real if limited extent.",
    save:function(s){frame.c1ev=s.chosen; frame.c1link=s.link;}},

  {type:'pick', tag:'Conclusion \u00b7 the verdict', prog:'Verdict',
    h2:'Land your verdict',
    intro:'A conclusion weighs both sides and still decides. Pick the verdict that does both. Avoid the absolute one and the one that sits on the fence.',
    correct:0,
    opts:[
      "Real but limited. It united people around pride and self-reliance and won gains, even as the poverty outlived it.",
      "Black Power completely united African Americans and fixed every single problem that they had ever faced anywhere.",
      "Black Power had some good sides and some bad sides, so it is hard to say whether it worked."
    
    ],
    expl:"<b>The first verdict weighs and still decides.</b> It admits what worked, names what did not, and lands on a judgement the essay has earned. The middle one is absolute. The last sits on the fence, and listing good and bad without deciding throws away your conclusion.",
    save:function(s){frame.verdict=s.opts[s.correct];}},

  {type:'frame'}
];

var stage=document.getElementById('stage');
function next(){ idx++; render(); window.scrollTo(0,0); }
function render(){
  var s=STEPS[idx];
  if(s.type==='cover') return renderCover();
  if(s.type==='pick') return renderPick(s);
  if(s.type==='evidence') return renderEvidence(s);
  if(s.type==='frame') return renderFrame();
}
function prog(s){ return s.prog?('<div class="cap-prog">Step '+idx+' of '+(STEPS.length-2)+' \u00b7 '+s.prog+'</div>'):''; }

function renderCover(){
  var lines=COVER.lines.map(function(l){return '<span>'+esc(l)+'</span>';}).join('<br>');
  stage.innerHTML='<div class="cover"><div class="cover-eyebrow">'+COVER.eyebrow+'</div>'+
    '<h1 class="cover-title">'+esc(COVER.title)+'</h1><div class="flourish"></div>'+
    '<div class="cover-line" id="cover-line">'+lines+'</div>'+
    '<button class="btn-primary btn-begin" id="begin-btn">Begin <span class="sa">&rarr;</span></button></div>';
  var sp=[].slice.call(document.querySelectorAll('#cover-line span'));
  sp.forEach(function(x,i){setTimeout(function(){x.classList.add('vis');}, 300+i*450);});
  document.getElementById('begin-btn').onclick=next;
}

function renderPick(s){
  var chosen=null;
  function draw(){
    var opts=s.opts.map(function(o,i){
      var cls='option', mark='';
      if(chosen!==null){ cls+=' selected'; if(i===s.correct){cls+=' correct'; mark='<span class="opt-mark">&#10003;</span>';} else if(i===chosen){cls+=' wrong'; mark='<span class="opt-mark">&#10007;</span>';} else {cls+=' dimmed';} }
      return '<button class="'+cls+'" data-i="'+i+'"'+(chosen!==null?' disabled':'')+'><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span class="opt-text">'+esc(o)+'</span>'+mark+'</button>';
    }).join('');
    var tail = chosen!==null ? '<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">'+s.expl+'</div></div><div class="cap-actions" style="margin-top:1.2rem"><button class="btn-primary" id="cont">Continue</button></div>' : '';
    stage.innerHTML=prog(s)+'<div class="card"><div class="stage-tag">'+s.tag+'</div><h2>'+esc(s.h2)+'</h2><p class="cap-intro">'+s.intro+'</p><div class="options">'+opts+'</div>'+tail+'</div>';
    if(chosen===null){ [].forEach.call(document.querySelectorAll('.option'),function(b){ b.onclick=function(){ chosen=+b.getAttribute('data-i'); draw(); }; }); }
    else { document.getElementById('cont').onclick=function(){ s.save(s); next(); }; }
  }
  draw();
}

function renderEvidence(s){
  var done=false, state={};
  function draw(){
    var rows=s.items.map(function(it,i){
      var cls='evrow', right='';
      if(state[i]&&!done) cls+=' use';
      if(done){ var u=!!state[i]; if(it.use&&u){cls+=' ok';right='<span class="evtag y">USE</span>';} else if(it.use&&!u){cls+=' miss';right='<span class="evtag y">USE</span>';} else if(!it.use&&u){cls+=' wrong';right='<span class="evtag n">LEAVE OUT</span>';} else {right='<span class="evtag n">LEAVE OUT</span>';} }
      var off = (done&&it.off)?'<span class="off">'+esc(it.off)+'</span>':'';
      var ctrl = done ? right : '<button class="evtoggle" data-i="'+i+'">'+(state[i]?'Using \u2713':'Use it')+'</button>';
      return '<div class="'+cls+'"><span class="evtext">'+esc(it.t)+off+'</span>'+ctrl+'</div>';
    }).join('');
    var foot;
    if(!done) foot='<div class="cap-actions"><button class="btn-primary" id="chk" disabled>Check my selection</button></div>';
    else foot='<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">'+s.expl+'</div></div><div class="cap-actions" style="margin-top:1.2rem"><button class="btn-primary" id="cont">Continue</button></div>';
    stage.innerHTML=prog(s)+'<div class="card"><div class="stage-tag">'+s.tag+'</div><h2>'+esc(s.h2)+'</h2>'+
      '<div class="yourpoint"><b>Your point</b>'+esc(s.ts)+'</div><p class="cap-intro">'+s.intro+'</p><div class="evlist">'+rows+'</div>'+foot+'</div>';
    if(!done){
      [].forEach.call(document.querySelectorAll('.evtoggle'),function(b){ b.onclick=function(){ var i=+b.getAttribute('data-i'); state[i]=!state[i]; draw(); }; });
      document.getElementById('chk').disabled=Object.keys(state).filter(function(k){return state[k];}).length===0;
      document.getElementById('chk').onclick=function(){ done=true; draw(); };
    } else {
      s.chosen=s.items.filter(function(x,i){return state[i]&&x.use;}).map(function(x){return x.t;});
      if(s.chosen.length===0) s.chosen=s.items.filter(function(x){return x.use;}).map(function(x){return x.t;});
      document.getElementById('cont').onclick=function(){ s.save(s); next(); };
    }
  }
  draw();
}

function renderFrame(){
  function ul(a){return '<ul>'+(a||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
  var f='<div class="fp"><div class="frole">Line of argument</div><div class="fts">'+esc(frame.arg)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 1 \u00b7 self-definition and pride</div><div class="fts">'+esc(frame.b1ts)+'</div><div class="flabel">Evidence</div>'+ul(frame.b1ev)+'<div class="flink">Link: '+esc(frame.b1link)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 2 \u00b7 the survival programmes</div><div class="fts">'+esc(frame.b2ts)+'</div><div class="flabel">Evidence</div>'+ul(frame.b2ev)+'<div class="flink">Link: '+esc(frame.b2link)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 3 \u00b7 counter-argument</div><div class="fts">'+esc(frame.c1ts)+'</div><div class="flabel">Evidence for the other side</div>'+ul(frame.c1ev)+'<div class="flink">Rebuttal: '+esc(frame.c1link)+'</div></div>'+
    '<div class="fp"><div class="frole">Verdict</div><div class="fts">'+esc(frame.verdict)+'</div></div>';
  stage.innerHTML='<div class="card"><div class="stage-tag">Your writing frame</div><h2>Take this away and write it up</h2>'+
    '<p class="cap-intro">This is the shape of a top essay: a clear line, three paragraphs each with a claim and its evidence, and a verdict that decides. You built every choice in it.</p>'+
    '<div class="frame">'+f+'</div>'+
    '<div class="writeup"><b>Now write the essay in full, in your own words.</b><div class="wsub">The frame gives you the shape and the facts. Turning these notes into full sentences, in the exam, is the part only you can do.</div></div><div class="cap-actions" style="margin-top:1.4rem"><button class="btn-primary" id="cap-advance">Continue to What Stuck&nbsp;&rarr;</button></div></div>';
  document.getElementById('cap-advance').onclick=function(){ kulaEmbed('advance'); };
  kulaEmbed('completed');
}

render();
</script>
